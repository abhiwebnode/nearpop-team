<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | NearPop Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F1F4F9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 2px solid #E5E7EB;
        }
        .logo { height: 40px; margin-bottom: 24px; }
        .code {
            font-size: 80px;
            font-weight: 800;
            color: #E64A19;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -4px;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            color: #0A0E1A;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #6B7280;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: #E64A19;
            color: #fff;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 12px;
            width: 100%;
        }
        .btn-sec {
            display: inline-block;
            background: #F1F4F9;
            color: #0A0E1A;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            border: 2px solid #E5E7EB;
        }
        .divider {
            font-size: 12px;
            color: #9CA3AF;
            font-weight: 600;
            margin: 10px 0;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #9CA3AF;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://nearpop.in/icons/logo.png" class="logo" alt="NearPop">
        <div class="code">404</div>
        <div class="title">Page Not Found</div>
        <div class="subtitle">
            The page you're looking for doesn't exist or has been moved.<br>
            Go back to the Marketing Hub.
        </div>
        <a href="/index.html" class="btn">🏠 Go to Marketing Hub</a>
        <div class="divider">or</div>
        <a href="/report.html" class="btn-sec">📋 Go to Visit Tracker</a>
        <div class="footer">
            NearPop Team Portal • nearpopteam.in<br>
            If you need help, WhatsApp Abhishek.
        </div>
    </div>
</body>
</html>
